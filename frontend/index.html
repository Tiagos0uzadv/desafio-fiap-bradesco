<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SentinelaOps</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Pessoa 3: esta pagina funciona, mas é provisória.
       Melhore o visual, separe em telas e acrescente o grafico. -->

  <header>
    <h1>SentinelaOps</h1>
    <div class="perfil">
      Perfil:
      <select id="perfil">
        <option value="visualizador">Visualizador</option>
        <option value="operador">Operador</option>
        <option value="admin" selected>Admin</option>
      </select>
    </div>
  </header>

  <section class="acoes-admin">
    <button id="btn-falha">Simular problema</button>
    <button id="btn-normal">Voltar ao normal</button>
    <button id="btn-limpar">Limpar histórico</button>
  </section>

  <section id="status" class="card">Carregando...</section>

  <section class="colunas">
    <div>
      <h2>Serviços monitorados</h2>
      <div id="servicos" class="card"></div>

      <h2>Aguardando aprovação</h2>
      <div id="pendentes"></div>
    </div>
    <div>
      <h2>Indicadores de negócio</h2>
      <div id="indicadores" class="card"></div>

      <h2>Inteligência artificial</h2>
      <div id="ia" class="card"></div>
    </div>
  </section>

  <h2>Histórico e auditoria</h2>
  <table id="auditoria">
    <thead>
      <tr><th>Evento</th><th>Decisão</th><th>Quem autorizou</th><th>Resultado</th><th>Quando</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
